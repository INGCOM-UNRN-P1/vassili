[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vassili"
version = "0.1.0"
description = "Motor de Mutation Testing en C para evaluación de calidad y robustez de suites de tests"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
vassili = "vassili.cli:app"

[project.entry-points."ripley.plugins"]
mutation_testing = "vassili.plugins.ripley_plugin:VassiliPlugin"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
