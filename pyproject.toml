[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vassili"
version = "0.2.0"
description = "Motor de Mutation Testing en C para evaluación de calidad y robustez de suites de tests"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Martín René Vilugrón", email = "martinvilu@gmail.com"}
]
maintainers = [
    {name = "Programación I [B6003] - UNRN Andina"}
]
requires-python = ">=3.11"
keywords = ["education", "c-programming", "pedagogical-tools", "unrn"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    # Núcleo común del ecosistema (N-ECO-14): contrato de línea de comandos y textos en español.
    "yutani[c] @ git+https://github.com/INGCOM-UNRN/yutani@6f95ad93c661adb4493414c6cc57534a18e8f2e0",
]

[project.optional-dependencies]
# Herramientas del ecosistema que se usan como biblioteca (N-ECO-01). Referencias git fijadas
# a commits publicados; sin el extra se usa el camino propio (gcc, sin sandbox de nostromo…).
ecosistema = [
    "daedalus @ git+https://github.com/INGCOM-UNRN-P1/daedalus@2f98e3974baa3ced1293739bf08a858ef81d6104",
    # Sandbox de cada corrida de un mutante (Ola 12, QoL #1011).
    "nostromo @ git+https://github.com/INGCOM-UNRN-P1/nostromo@87bd62373e718ab0e11b4ab170026138feb8d46d",
]

[project.urls]
Homepage = "https://github.com/INGCOM-UNRN-P1/vassili"
Repository = "https://github.com/INGCOM-UNRN-P1/vassili.git"
Issues = "https://github.com/INGCOM-UNRN-P1/vassili/issues"

[project.scripts]
vassili = "vassili.cli:app"

[project.entry-points."ripley.plugins"]
mutation_testing = "vassili.plugins.ripley_plugin:VassiliPlugin"

[dependency-groups]
# En `dependency-groups` (PEP 735) y no en `optional-dependencies`: uv instala
# este grupo con un `uv sync` a secas, de modo que el venv del repo queda listo
# para correr la suite. Como extra opcional había que acordarse de
# `--extra dev`, y sin eso `.venv/bin/python -m pytest` fallaba con
# "No module named pytest".
dev = [
    "pytest>=7.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]

[tool.hatch.metadata]
# Las dependencias del ecosistema son referencias directas a git (nunca por nombre en PyPI).
allow-direct-references = true

[tool.mypy]
# Tipos del paquete (N-ECO-08): `uv run --with mypy mypy`, igual que el CI.
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
